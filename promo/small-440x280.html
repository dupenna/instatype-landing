<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InstaType — small promo 440x280</title>
<link rel="stylesheet" href="../_shared.css">
<style>
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 80% at 80% 110%, rgba(255,91,46,0.18), transparent 60%),
      radial-gradient(ellipse 60% 60% at -10% -10%, rgba(255,126,77,0.15), transparent 60%),
      var(--bg);
    padding: 28px 30px;
    display: grid;
    grid-template-columns: 1fr 150px;
    align-items: center;
    gap: 18px;
    position: relative;
  }
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(28,26,23,0.04) 1px, transparent 1px);
    background-size: 4px 4px;
    pointer-events: none;
  }
  .left { position: relative; z-index: 2; }
  .brand-line {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .brand-logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
    color: white;
    font-family: var(--font-serif); font-style: italic; font-size: 22px;
    box-shadow: 0 6px 18px rgba(255,91,46,0.4);
    letter-spacing: -0.02em;
  }
  .wordmark {
    font-family: var(--font-serif); font-style: italic;
    font-size: 30px; letter-spacing: -0.02em; line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .wordmark b {
    font-style: normal; font-family: var(--font-sans);
    font-weight: 700; font-size: 26px; margin-left: -2px;
    letter-spacing: -0.025em;
  }
  h1 {
    font-family: var(--font-serif); font-style: italic;
    font-size: 30px; line-height: 1.05; letter-spacing: -0.015em;
    color: var(--ink); margin-bottom: 12px;
    font-weight: 400;
  }
  h1 b { font-style: normal; font-weight: 700; font-family: var(--font-sans); letter-spacing: -0.02em; }
  .accent { color: var(--accent-deep); }
  .tagline {
    font-size: 13px; color: var(--ink-2); line-height: 1.45;
  }
  .right {
    position: relative; z-index: 2;
    display: grid; place-items: center;
  }
  .kbd-tile {
    background: white; border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px;
    box-shadow: 0 10px 24px rgba(28,26,23,0.10);
    text-align: center;
  }
  .kbd-eyebrow {
    font-family: var(--font-mono);
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--muted); margin-bottom: 10px;
  }
  .kbd-row { display: flex; gap: 4px; justify-content: center; }
  .kbd-row kbd {
    font-family: var(--font-mono); font-weight: 700;
    background: var(--surface-2);
    border: 1px solid var(--line-2);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 14px;
    color: var(--ink);
    min-width: 28px;
  }
  .kbd-foot {
    margin-top: 10px;
    font-size: 10.5px; color: var(--ink-2); line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="brand-line">
      <div class="brand-logo">iT</div>
      <div class="wordmark"><span>insta</span><b>Type</b></div>
    </div>
    <h1>Your <b>text snippets,</b><br>one <span class="accent">shortcut away.</span></h1>
    <p class="tagline">Save replies, signatures, addresses — paste them anywhere with the right-click menu or a keyboard shortcut.</p>
  </div>
  <div class="right">
    <div class="kbd-tile">
      <div class="kbd-eyebrow">Summon</div>
      <div class="kbd-row">
        <kbd>⌥</kbd><kbd>⇧</kbd><kbd>T</kbd>
      </div>
      <div class="kbd-foot">on any field</div>
    </div>
  </div>
</body>
</html>
